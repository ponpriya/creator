# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sapwd

# Disable Liquibase for tests (use JPA to create schema)
spring.liquibase.enabled=false

# Optional: Configure DDL behavior for testing
# 'create-drop' creates the schema before tests and drops it afterwards
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: Show SQL queries in the console for debugging
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration for tests
app.jwt.secret=test-secret-key-at-least-512-bits-long-for-hs512-algorithm-testing-purposes-only-do-not-use-in-production
app.jwt.expiration=3600000

# Disable rate limiting for tests (can be overridden per test)
rate.limit.enabled=false
rate.limit.capacity=100
rate.limit.refill.tokens=100
rate.limit.refill.duration=60


# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION}

# Geocoding Configuration
geocoding.enabled=${GEOCODING_ENABLED}
geocoding.provider=${GEOCODING_PROVIDER}
